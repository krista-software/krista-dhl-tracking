import java.util.regex.Pattern

apply plugin: 'java-library'
apply plugin: 'maven-publish'
jar.archiveBaseName = "dhl-tracking-and-delivery"
group 'com.krista.extensions.logistics.trackinganddelivery.dhl'
version(System.getenv('BRANCH') == null ? "local" : System.getenv('BRANCH').replace("/", "_").replace("dhl-tracking-and-delivery-", ""))

if (rootProject.file('buildnr.txt').canRead()) {
    ext.buildnr = rootProject.file('buildnr.txt').text.trim()
} else {
    ext.buildnr = "0";
}

/*
 * Use extension.name for archiveBaseName, extension.version for version.
 */
def computedBaseName = "DeliveryandTracking"
def computedVersion = "local"

tasks.register("setReleaseProperties") {
    dependsOn("generateReleaseProperties")
    doFirst {
        def releasePropsFile = file("release.properties")
        if (releasePropsFile.exists()) {
            def props = new Properties()
            releasePropsFile.withInputStream { stream -> props.load(stream) }
            computedBaseName = (props['extension.name'] ?: computedBaseName).replaceAll(/\s+/, "")
            computedVersion = props['extension.version'] ?: computedVersion

            project.ext.set("finalBaseName", computedBaseName)
            project.version = computedVersion

            println "✔ Loaded extension name = ${computedBaseName}, version = ${computedVersion}"
        } else {
            logger.warn("⚠ release.properties not found; using default values.")
            project.ext.set("finalBaseName", computedBaseName)
            project.version = computedVersion
        }
    }
}


tasks.register('updateVersion') {
    doFirst {
        project.ext.newbuildnr = Integer.parseInt(project.ext.buildnr) + 1
        print "Building extension version: " + version as String + "-" + project.ext.newbuildnr
        rootProject.file('buildnr.txt').text = project.ext.newbuildnr
        System.clearProperty("extensionVersion")
        System.setProperty("extensionVersion", version as String + "-" + project.ext.newbuildnr)
    }
}
compileJava.dependsOn clean
compileJava.dependsOn updateVersion

System.setProperty("extensionVersion", version.toString())

sourceCompatibility = '21'
targetCompatibility = '21'

repositories {
    maven {
        url "https://packages.cicd.in.antbrains.com/artifactory/libs-release"
    }
    mavenCentral()
    mavenLocal()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all,-serial'
}

tasks.register('compile') {
    dependsOn compileJava
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            afterEvaluate {
                artifactId = jar.archiveBaseName.get()
                groupId = rootProject.group
            }
        }
    }
    repositories {
        mavenLocal()
        maven {
            credentials {
                username = rootProject.properties['MAVEN_USERNAME']
                password = rootProject.properties['MAVEN_PASSWORD']
            }
            authentication {
                basic(BasicAuthentication)
            }
            url rootProject.properties['MAVEN_UPLOAD_URL']
        }
    }
}

configurations {
    implementation {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    annotationProcessor 'app.krista:extension-impl-anno-processors:1.0.115'
    compileOnly 'app.krista:krista-apis:1.0.115'
    compileOnly 'org.glassfish.hk2:hk2-api:3.0.3'
    compileOnly 'org.apache.logging.log4j:log4j-slf4j-impl:2.22.0'

    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
    implementation 'org.glassfish.jersey.core:jersey-client:3.1.3'
    implementation 'org.glassfish.jersey.media:jersey-media-json-jackson:3.1.3'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:3.1.3'

    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'commons-validator:commons-validator:1.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.3'

    implementation 'org.asynchttpclient:async-http-client:3.0.1'

    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.slf4j:slf4j-simple:2.0.9'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
}

tasks.register('createSourceDir', Exec) {
    dependsOn processResources
    commandLine "mkdir", "-p", "$projectDir/build/classes/java/main/META-INF/project"
}

tasks.register('copyGradleFile', Exec) {
    dependsOn createSourceDir
    commandLine "cp", "$projectDir/build.gradle", "$projectDir/build/classes/java/main/META-INF/project/build.gradle"
}

tasks.register('includeSources', Exec) {
    dependsOn copyGradleFile
    commandLine "cp", "-r", "$projectDir/src", "$projectDir/build/classes/java/main/META-INF/project/src"
}

tasks.register('candidate', Exec) {
    commandLine "env",
            "DOCKER_UPLOAD_REPO=" + rootProject.properties['DOCKER_UPLOAD_REPO'],
            "MAVEN_URL=" + System.properties['MAVEN_URL'],
            "MAVEN_UPLOAD_URL=" + rootProject.properties['MAVEN_UPLOAD_URL'],
            "MAVEN_USERNAME=" + rootProject.properties['MAVEN_USERNAME'],
            "MAVEN_PASSWORD=" + rootProject.properties['MAVEN_PASSWORD'],
            "bash", "candidate.sh"
    standardOutput = new ByteArrayOutputStream()
    ext.output = {
        return standardOutput.toString()
    }
}

tasks.register('release', Exec) {
    commandLine "env",
            "DOCKER_UPLOAD_REPO=" + rootProject.properties['DOCKER_UPLOAD_REPO'],
            "MAVEN_URL=" + System.properties['MAVEN_URL'],
            "MAVEN_UPLOAD_URL=" + rootProject.properties['MAVEN_UPLOAD_URL'],
            "MAVEN_USERNAME=" + rootProject.properties['MAVEN_USERNAME'],
            "MAVEN_PASSWORD=" + rootProject.properties['MAVEN_PASSWORD'],
            "bash", "release.sh"
    standardOutput = new ByteArrayOutputStream()
    ext.output = {
        return standardOutput.toString()
    }
}

/*
    Task to generate release.properties files in below format.
    extension.version=<version>
    extension.name=<name>
    domain.name=<domain>
    ecosystem.name=<ecosystem>
    Every extension developer should update extensionFile and areaFileName with relative path.
 */

abstract class GenerateReleasePropertiesTask extends DefaultTask {
    @TaskAction
    def generateProperties() {
        def extensionFilePath = 'src/main/java/com/krista/extensions/logistics/trackinganddelivery/dhl/DHLTrackingExtension.java'
        def areaFilePath = 'src/main/java/com/krista/extensions/logistics/trackinganddelivery/dhl/catalog/TrackingArea.java'
        def extensionFile = project.file(extensionFilePath)
        def areaFile = project.file(areaFilePath)
        if (!extensionFile.exists()) {
            throw new GradleException("Extension file not found: ${extensionFilePath}")
        }
        if (!areaFile.exists()) {
            throw new GradleException("Area file not found: ${areaFilePath}")
        }
        def properties = new Properties()
        // Pre-compile the regex pattern for better performance
        def keyValuePattern = Pattern.compile(/(\w+)\s*=\s*"([^"]+)"/)
        // Extract Extension annotation information
        extractAnnotationInfo(extensionFile, "@Extension", keyValuePattern) { key, value ->
            if (key == "name") {
                properties.setProperty("extension.name", value)
                logger.lifecycle("Found extension name: ${value}")
            } else if (key == "version") {
                properties.setProperty("extension.version", value)
                logger.lifecycle("Found extension version: ${value}")
            }
        }

        // Set default extension name if not found
        if (!properties.getProperty('extension.name')) {
            properties.setProperty("extension.name", "DeliveryandTracking")
            logger.lifecycle("Set default extension name: DeliveryandTracking")
        }

        // Extract Domain annotation information
        extractAnnotationInfo(areaFile, "@Domain", keyValuePattern) { key, value ->
            if (key == "name") {
                properties.setProperty("domain.name", value)
                logger.lifecycle("Found domain name: ${value}")
            } else if (key == "ecosystemName") {
                properties.setProperty("ecosystem.name", value)
                logger.lifecycle("Found ecosystem name: ${value}")
            }
        }


        if (!properties.getProperty('extension.version')) {
            throw new GradleException("Could not find extension version in ${extensionFilePath}")
        }

        // Set default values if not found in annotations
        if (!properties.getProperty('domain.name')) {
            properties.setProperty("domain.name", "NLP")
            logger.lifecycle("Set default domain name: NLP")
        }

        if (!properties.getProperty('ecosystem.name')) {
            properties.setProperty("ecosystem.name", "AI")
            logger.lifecycle("Set default ecosystem name: AI")
        }

        def releasePropertiesFile = project.file('release.properties')
        def content = properties.collect { key, value -> "${key}=${value}" }.join('\n')
        releasePropertiesFile.text = content + '\n'
        logger.lifecycle("Generated release.properties with content:\n${content}")
    }
    /**
     * Extracts annotation information from a file
     * @param file The file to extract from
     * @param annotationName The annotation name to look for
     * @param keyValuePattern The regex pattern to extract key-value pairs
     * @param processProperty Closure to process each property
     */
    private static void extractAnnotationInfo(File file, String annotationName, Pattern keyValuePattern, Closure processProperty) {
        StringBuilder annotationText = new StringBuilder()
        boolean inAnnotation = false
        file.eachLine { line ->
            line = line.trim()
            if (line.contains(annotationName)) {
                inAnnotation = true
            }
            if (inAnnotation) {
                annotationText.append(line)
                if (line.contains(")")) {
                    inAnnotation = false
                    def matcher = keyValuePattern.matcher(annotationText.toString())
                    while (matcher.find()) {
                        def key = matcher.group(1)
                        def value = matcher.group(2)
                        processProperty.call(key, value)
                    }
                }
            }
        }
    }
}

tasks.register('generateReleaseProperties', GenerateReleasePropertiesTask) {
    group = 'build'
    description = 'Generates release.properties file with extension version and domain information'
}

tasks.named("jar") {
    dependsOn tasks.named("generateReleaseProperties")
}

jar {
    dependsOn tasks.named("setReleaseProperties")
    archiveBaseName = project.ext.has("finalBaseName") ? project.ext.finalBaseName : "DeliveryandTracking"

    manifest {
    }
    from {
        configurations.implementation.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    duplicatesStrategy = "exclude"
}

/**
 * Task to upload extension to DAZ appliance
 * This task properly quotes domain and extension names with spaces
 */
tasks.register('uploadToDaz', Exec) {
    dependsOn jar
    
    doFirst {
        def releasePropsFile = file("release.properties")
        if (!releasePropsFile.exists()) {
            throw new GradleException("release.properties not found. Run generateReleaseProperties first.")
        }
        
        def props = new Properties()
        releasePropsFile.withInputStream { stream -> props.load(stream) }
        
        def ecosystem = props['ecosystem.name']
        def domain = props['domain.name']
        def extName = props['extension.name']
        def version = props['extension.version']
        
        // Sanitize for JAR filename (remove spaces)
        def sanitizedName = extName.replaceAll(/\s+/, "").toLowerCase()
        
        logger.lifecycle("Uploading extension to DAZ:")
        logger.lifecycle("  Ecosystem: ${ecosystem}")
        logger.lifecycle("  Domain: ${domain}")
        logger.lifecycle("  Extension: ${extName}")
        logger.lifecycle("  Version: ${version}")
        
        // Set command with properly quoted arguments
        commandLine 'python3',
            '/home/jenkins/agent/workspace/global-catalog/tools/br_script/jar-to-daz.py',
            '-appliance_version', version,
            '-ecosystem', ecosystem,
            '-domain', domain,              // Properly quoted by Gradle
            '-ext_title', extName,          // Properly quoted by Gradle
            '-name', sanitizedName
    }
}
