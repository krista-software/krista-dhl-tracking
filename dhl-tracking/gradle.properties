# Gradle properties for DHL Tracking Extension

# Java 21 configuration
# Note: Removed hardcoded org.gradle.java.home to allow Jenkins/CI to use system Java
# Local developers can set this in their local gradle.properties if needed

# Gradle daemon configuration
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# JVM arguments
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

